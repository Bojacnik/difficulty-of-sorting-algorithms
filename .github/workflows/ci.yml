name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build DifficultyOfSortingAlgorithms.slnx -c Release
      - run: dotnet test --solution DifficultyOfSortingAlgorithms.slnx -c Release --no-build
